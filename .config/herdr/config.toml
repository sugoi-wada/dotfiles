onboarding = false
[theme]
name = "catppuccin"

[theme.custom]
text = "#f2f4f8"
subtext0 = "#d6dae0"
overlay1 = "#b8bec7"
overlay0 = "#9aa1ac"

[ui.toast]
delivery = "system"

# サイドバーのエージェント表示を見やすくする
# (state_icon + workspace + agent を1行目、ターミナルタイトルを2行目に)
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab", "agent"],
  # 2行目は既定だと暗くて読めないので明示的に明るい色を指定する
  [{ token = "terminal_title_stripped", fg = "#f2f4f8" }],
]

##############################################
# hunk (自作プラグイン: ~/.dotfiles/.config/herdr/plugins/hunk-diff)
# prefix は Ctrl+B
##############################################

# ディレクトリを選んで diff を開く
# (~/tasks 常駐だと cwd 依存ではタスク管理リポジトリの diff になるため)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "hunk.pick"
description = "hunk: ディレクトリを選んで diff (全画面)"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "hunk.pick-split"
description = "hunk: ディレクトリを選んで diff (split)"

# フォーカス中ペインの cwd をそのまま使う
[[keys.command]]
key = "prefix+ctrl+d"
type = "plugin_action"
command = "hunk.worktree"
description = "hunk: 未コミットの diff (全画面)"

# レビューコメントをエージェントへ送る
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "hunk.feedback"
description = "hunk: コメントをエージェントへ送る"
